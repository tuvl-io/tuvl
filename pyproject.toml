[project]
name = "tuvl"
version = "2.0.3"
description = "Intelligent workflows, deterministic execution. Declare agents and their contracts in YAML; tuvl checks them before they run, bounds every model call, journals every step, and refuses anything the contract doesn't declare."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "tuvl.io", email = "developer@tuvl.io" }]
keywords = ["workflow", "orchestration", "ai", "llm", "agents", "mcp", "spec-driven", "fastapi", "yaml", "backend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Ranges here are what downstream resolvers see (this is published-library
    # metadata); uv.lock carries the exact audited pins for our own builds.
    # --- CLI ---
    "typer>=0.26.5,<0.27", # Compatible with click 8.4.1
    "rich>=15.0.0",
    # --- Core Engine & AI (audited minor kept narrow for security) ---
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
    # --- REST API Server ---
    "fastapi>=0.136.0",
    "starlette>=1.3.1", # imported directly (request plumbing)
    "uvicorn[standard]>=0.44.0",
    "python-multipart>=0.0.31", # OAuth2PasswordRequestForm (login) needs it at import
    # --- Data, Persistence & Protocols ---
    "pydantic-settings>=2.14.2,<3",
    "sqlmodel>=0.0.38",
    "sqlalchemy[asyncio]>=2.0,<2.1", # imported directly, not only via sqlmodel
    "asyncpg>=0.31.0",
    "greenlet>=3.4.0", # Required for async SQLAlchemy/SQLModel workflows
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
    # --- Security ---
    "PyJWT[crypto]>=2.15.0", # Ed25519-signed access tokens (EdDSA)
    "cryptography>=43.0.0", # imported directly (Ed25519 key handling)
    "bcrypt>=5.0.0",
    # --- Observability ---
    "structlog>=24.0.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.42.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "cronsim>=2.7",
]

[project.optional-dependencies]
# The developer toolchain: the tuvl-insight package (the browser UI, `tuvl init`, `tuvl dev`, `tuvl ship`, the lint
# engine, spec and code generation) plus the production extras.
# Install with: pip install tuvl[standard]
standard = [
    "tuvl-insight>=2.0.3",
    "tuvl[mcp,redis,vector,otel-grpc]",
]

# Features a production image installs only when the project uses them: `tuvl ship` reads the
# project and pins exactly these (see tuvl.extras). A bare `pip install tuvl` has none of them.
mcp = ["mcp>=1.30.0,<2"]  # `use: mcp` tools, MCP export, `tuvl serve mcp` (2.x renamed FastMCP)
redis = ["redis>=5.0.0"]  # a `redis` datasource
vector = ["pgvector>=0.3.0"]  # vector search (pulls in numpy)
otel-grpc = ["opentelemetry-exporter-otlp-proto-grpc>=1.42.0"]  # TUVL_OTLP_PROTOCOL=grpc

# Dev tooling is a PEP 735 dependency group (uv-native), not a published extra.
[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mypy>=2.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.3.0",
]

[project.scripts]
tuvl = "tuvl.cli.main:main"

[project.urls]
Homepage = "https://tuvl.io"
Documentation = "https://tuvl.dev"
Repository = "https://github.com/tuvl-io/tuvl"
Changelog = "https://github.com/tuvl-io/tuvl/blob/main/CHANGELOG.md"
Issues = "https://github.com/tuvl-io/tuvl/issues"

[tool.uv.workspace]
members = ["insight"]

[tool.uv.sources]
tuvl-insight = { workspace = true }
tuvl = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuvl"]
# Exclude compiled UI assets — shipped separately via tuvl-insight
exclude = ["src/tuvl/cli/ui"]

[tool.hatch.build.targets.sdist]
exclude = [
    "insight",
    "ui/node_modules",
    "ui/src",
    ".github",
    "tests",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "G",   # flake8-logging-format — bans f-strings + .format() + % in logger calls
    "LOG", # flake8-logging — catches misuse of the stdlib logging module
    "ANN", # flake8-annotations — ratchet: new code must be annotated
]
ignore = [
    "E501",   # line too long — handled by ruff formatter
    "B008",   # do not perform function calls in default argument (FastAPI Depends pattern)
    "ANN401", # Any is a deliberate choice in this dict-driven engine
]

[tool.ruff.lint.isort]
known-first-party = ["tuvl", "tuvl_insight"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# ASCII art in the banner intentionally contains trailing whitespace for alignment
"src/tuvl/cli/__init__.py" = ["W291", "W293"]
# Class-named variables are intentional (dynamic model/schema class creation)
"src/tuvl/core/api/crud_router.py" = ["N806"]
"src/tuvl/core/api/manager.py" = ["N806"]
# Dev-mode-only surface — annotate when its endpoints get pydantic models.
"insight/src/tuvl_insight/api/dev_core_router.py" = ["ANN"]
"src/tuvl/core/dev/artifacts.py" = ["ANN"]
# The annotation ratchet is for src/ — test signatures stay lightweight.
"tests/**" = ["ANN", "N806"]  # N806: generated model classes bound to capitalised locals

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
pretty = true

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hung test fails and is named, instead of stalling the run (TD-60).
timeout = 180
