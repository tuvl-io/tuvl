[project]
name = "tuvl-insight"
version = "2.0.3"
description = "The browser UI for tuvl 2.0: write specs, design workflows on a canvas, run them step by step with approvals, and see what every run did."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "tuvl.io", email = "developer@tuvl.io" }]

dependencies = [
    "tuvl>=2.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Wheel build ──────────────────────────────────────────────────────────────
# src layout: the package is insight/src/tuvl_insight. static/ holds the compiled UI (`make build-ui`);
# those files are gitignored build output, which hatchling would leave out of the wheel, so `artifacts`
# names them (the tracked favicons and fonts come with the package either way).
[tool.hatch.build.targets.wheel]
packages = ["src/tuvl_insight"]
artifacts = ["src/tuvl_insight/static/**"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "tests"]
