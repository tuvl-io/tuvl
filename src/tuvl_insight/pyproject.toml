[project]
name = "tuvl-insight"
version = "2.0.3"
description = "The browser UI for tuvl 2.0: write specs, design workflows on a canvas, run them step by step with approvals, and see what every run did."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "tuvl.io", email = "developer@tuvl.io" }]

dependencies = [
    "tuvl>=2.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Wheel build ──────────────────────────────────────────────────────────────
# The build context is this directory (tuvl/src/tuvl_insight/).
# Inside it, __init__.py and static/ are at the top level — there is NO
# nested src/tuvl_insight/ subdirectory.
#
# To ship them under the "tuvl_insight" import name we use force-include
# to map: this dir's __init__.py → tuvl_insight/__init__.py in the wheel,
# and this dir's static/ → tuvl_insight/static/ in the wheel.
#
# Previous config:
#     packages = ["src/tuvl_insight"]
#     include  = ["src/tuvl_insight/static/**"]
# was relative to the WORKSPACE ROOT and resolved to a non-existent path
# during a workspace-member build.  Hatchling silently produced an empty
# wheel — only metadata, no Python, no UI assets — which is what shipped
# to PyPI in 2026.2.3b1.

[tool.hatch.build.targets.wheel]
packages = []   # disable name-based auto-detect
[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "tuvl_insight/__init__.py"
"static"      = "tuvl_insight/static"

[tool.hatch.build.targets.sdist]
exclude = [".github", "tests"]
